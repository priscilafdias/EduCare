<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}EduCare{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body id="mainBody">
    <div class="accessibility-bar">
        <span>👁 Accessibility:</span>
        <button class="theme-btn active" id="btnDefault" onclick="setTheme('default')">Default</button>
        <button class="theme-btn pink" id="btnPink" onclick="setTheme('pink')">🩷 Pink</button>
        <button class="theme-btn blue" id="btnBlue" onclick="setTheme('blue')">💙 Blue</button>
    </div>

    <div style="margin-top: 40px;">
        {% block content %}{% endblock %}
    </div>

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
